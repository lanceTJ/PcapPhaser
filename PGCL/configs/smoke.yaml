seed: 42
k_fold: null

data:
  label_col: Label
  test_size: 0.2
  stratify: true
  corr_threshold: 0.99
  max_samples_per_class: 32

dataloader:
  batch_size: 16
  num_workers: 0
  pin_memory: false
  persistent_workers: false

model:
  encoder_out_dim: 16
  proj_out_dim: 8
  dropout: 0.0

pretrain:
  epochs: 2
  lr: 0.001
  weight_decay: 0.0
  temperature: 0.5
  noise_std: 0.01
  feat_drop_prob: 0.0
  patience: 2
  max_grad_norm: 1.0
  use_amp: true
  scheduler:
    name: cosine
    t_max: 2

finetune:
  enabled: true
  stage_a:
    epochs: 1
    lr: 0.01
    weight_decay: 0.0
    t_max: 1
    unfreeze_encoder: false
  stage_b:
    enabled: true
    epochs: 1
    lr: 0.001
    weight_decay: 0.0
    t_max: 1
    unfreeze_encoder: true
